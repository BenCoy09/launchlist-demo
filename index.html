<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Launchlist</title></head>
<body style="font-family:system-ui;max-width:420px;margin:48px auto;padding:0 16px">
<h1>Launchlist</h1>
<p>Get early access. We email you once.</p>
<form id="signup">
  <input id="email" type="email" placeholder="you@example.com" required>
  <button type="submit">Sign up</button>
</form>
<p id="ok" hidden>Thanks, you're on the list.</p>
<footer>© Launchlist</footer>
<script>
// look the form up once
const form = document.querySelector('form#signup-form');
form.addEventListener('submit', e => {
  e.preventDefault();
  document.getElementById('ok').hidden = false;
});
</script>
</body>
</html>
